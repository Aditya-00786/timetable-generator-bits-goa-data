name: Convert timetable PDF

# Lets you update the whole timetable without cloning: upload the official PDF into data/ on a
# branch (GitHub → Add file → Upload files → "Commit to a new branch"), and this converts it to
# data/timetable.csv and commits the result back to that branch. Then open a PR → main and the
# normal Validate data → review → sync flow takes over.
#
# It runs on any branch EXCEPT main (main is branch-protected, so automation can't push there —
# the conversion always lands on a branch that you merge via PR). The bot's commit uses
# GITHUB_TOKEN, so it does not re-trigger this workflow (no loop).

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'data/**.pdf'
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semester (e.g. 2025-S2). Leave blank to keep the current data/semester.txt.'
        required: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install # full install — the converter needs the pdfjs-dist dev dependency

      - name: Convert PDF → data/timetable.csv (validate, then commit back)
        env:
          SEMESTER_INPUT: ${{ github.event.inputs.semester }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Refusing to modify the protected main branch — run this on a separate branch."
            exit 1
          fi
          PDF="$(ls data/*.pdf 2>/dev/null | head -1 || true)"
          if [ -z "$PDF" ]; then
            echo "No PDF found in data/ — nothing to convert."
            exit 0
          fi

          # Semester: the workflow_dispatch input wins; otherwise read it from the PDF filename
          # (e.g. timetable-2025-S2.pdf). Only update data/semester.txt when it actually differs
          # from the current value — a blank or unchanged semester leaves the file untouched.
          CUR="$(tr -d '[:space:]' < data/semester.txt 2>/dev/null || true)"
          SEM="$SEMESTER_INPUT"
          if [ -z "$SEM" ]; then
            SEM="$(printf '%s' "$PDF" | grep -oiE '20[0-9]{2}-?S[0-9]' | head -1 || true)"
          fi
          if [ -n "$SEM" ]; then
            SEM="$(printf '%s' "$SEM" | tr 'a-z' 'A-Z' | sed -E 's/^(20[0-9]{2})-?(S[0-9])$/\1-\2/')"
          fi
          SEM_CHANGED=""
          if [ -n "$SEM" ] && [ "$SEM" != "$CUR" ]; then
            echo "$SEM" > data/semester.txt
            SEM_CHANGED=1
            echo "Semester updated: '${CUR}' -> '${SEM}'"
          elif [ -n "$SEM" ]; then
            echo "Semester '$SEM' matches current — leaving data/semester.txt unchanged."
          else
            echo "No semester provided — keeping data/semester.txt ('$CUR')."
          fi

          echo "Converting $PDF → data/timetable.csv"
          node scripts/pdf-to-csv.mjs "$PDF" data/timetable.csv
          node scripts/validate-data.mjs           # fail the run (before committing) if invalid

          git rm --quiet "$PDF"                     # remove the source PDF; the CSV is the artifact
          git add data/timetable.csv
          if [ -n "$SEM_CHANGED" ]; then git add data/semester.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: convert ${PDF##*/} → data/timetable.csv"
          if [ -n "$SEM_CHANGED" ]; then MSG="$MSG (semester $SEM)"; fi
          git commit -m "$MSG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed to ${GITHUB_REF_NAME}."

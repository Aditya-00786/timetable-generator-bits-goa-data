name: Validate data

# Runs on every PR (and on pushes to main) that touch the data files. It needs NO secrets, so it
# is safe to run on pull requests from forks — contributors get instant feedback on their CSVs.

on:
  pull_request:
    paths:
      - 'data/**.csv'
      - 'data/semester.txt'
  push:
    branches:
      - main
    paths:
      - 'data/**.csv'
      - 'data/semester.txt'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate CSV data
        run: node scripts/validate-data.mjs

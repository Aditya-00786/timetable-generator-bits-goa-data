name: Convert timetable PDF (Adobe)

# DEFAULT converter. Update the whole timetable without cloning: upload the official PDF into data/
# on a branch (GitHub → Add file → Upload files → "Commit to a new branch"), and this converts it to
# data/timetable.csv via Adobe PDF Services and commits the result back to that branch. Then open a
# PR → main and the normal Validate data → review → sync flow takes over.
#
# Runs on any branch EXCEPT main (main is branch-protected, so automation lands on a branch you merge
# via PR). The bot commit uses GITHUB_TOKEN, so it does not re-trigger this workflow (no loop).
#
# The old pdfjs converter (convert-pdf.yml) is kept as a MANUAL backup you can run from the Actions
# tab if a conversion ever needs it.
#
# Requires repo Actions secrets: PDF_SERVICES_CLIENT_ID and PDF_SERVICES_CLIENT_SECRET
# (Adobe OAuth Server-to-Server credentials).

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'data/**.pdf'
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semester (e.g. 2025-S2). Leave blank to detect from the PDF / keep current.'
        required: false

permissions:
  contents: write
  statuses: write # to report the "validate" status on the bot's commit (see below)

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install # full install — the Adobe converter needs the dev deps (sdk, pdf-lib, exceljs)

      - name: Convert PDF → data/timetable.csv (validate, then commit back)
        env:
          SEMESTER_INPUT: ${{ github.event.inputs.semester }}
          GH_TOKEN: ${{ github.token }}
          PDF_SERVICES_CLIENT_ID: ${{ secrets.PDF_SERVICES_CLIENT_ID }}
          PDF_SERVICES_CLIENT_SECRET: ${{ secrets.PDF_SERVICES_CLIENT_SECRET }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Refusing to modify the protected main branch — run this on a separate branch."
            exit 1
          fi
          if [ -z "${PDF_SERVICES_CLIENT_ID}" ] || [ -z "${PDF_SERVICES_CLIENT_SECRET}" ]; then
            echo "Missing Adobe secrets. Add PDF_SERVICES_CLIENT_ID and PDF_SERVICES_CLIENT_SECRET to the repo's Actions secrets."
            exit 1
          fi
          PDF="$(ls data/*.pdf 2>/dev/null | head -1 || true)"
          if [ -z "$PDF" ]; then
            echo "No PDF found in data/ — nothing to convert."
            exit 0
          fi

          echo "Converting $PDF → data/timetable.csv"
          CONV_OUT="$(node scripts/convert-adobe.mjs "$PDF" data/timetable.csv)"
          echo "$CONV_OUT"

          # Semester precedence: workflow_dispatch input > PDF filename (e.g. timetable-2025-S2.pdf)
          # > the semester printed on the PDF's title page (detected by the converter). Only update
          # data/semester.txt when it actually differs from the current value — otherwise untouched.
          CUR="$(tr -d '[:space:]' < data/semester.txt 2>/dev/null || true)"
          SEM="$SEMESTER_INPUT"
          if [ -z "$SEM" ]; then
            SEM="$(printf '%s' "$PDF" | grep -oiE '20[0-9]{2}-?S[0-9]' | head -1 || true)"
          fi
          if [ -z "$SEM" ]; then
            SEM="$(printf '%s' "$CONV_OUT" | grep -i 'Detected semester' | grep -oiE '20[0-9]{2}-S[0-9]' | head -1 || true)"
          fi
          if [ -n "$SEM" ]; then
            SEM="$(printf '%s' "$SEM" | tr 'a-z' 'A-Z' | sed -E 's/^(20[0-9]{2})-?(S[0-9])$/\1-\2/')"
          fi
          SEM_CHANGED=""
          if [ -n "$SEM" ] && [ "$SEM" != "$CUR" ]; then
            echo "$SEM" > data/semester.txt
            SEM_CHANGED=1
            echo "Semester updated: '${CUR}' -> '${SEM}'"
          elif [ -n "$SEM" ]; then
            echo "Semester '$SEM' matches current — leaving data/semester.txt unchanged."
          else
            echo "No semester provided — keeping data/semester.txt ('$CUR')."
          fi

          node scripts/validate-data.mjs           # fail the run (before committing) if invalid

          git rm --quiet "$PDF"                     # remove the source PDF; the CSV is the artifact
          git add data/timetable.csv
          if [ -n "$SEM_CHANGED" ]; then git add data/semester.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: convert ${PDF##*/} → data/timetable.csv (Adobe)"
          if [ -n "$SEM_CHANGED" ]; then MSG="$MSG (semester $SEM)"; fi
          git commit -m "$MSG"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          # validate-data.mjs already passed above. This commit was pushed with GITHUB_TOKEN, which
          # does NOT trigger the "Validate data" workflow, so report the required "validate" status
          # directly on it — otherwise a PR from this branch would wait forever for that check.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context=validate -f "description=Validated by Convert timetable PDF (Adobe)" >/dev/null
          echo "Reported validate=success on $(git rev-parse HEAD)."
          echo "Committed to ${GITHUB_REF_NAME}."
